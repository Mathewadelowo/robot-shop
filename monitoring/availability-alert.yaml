apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: robot-shop-availability
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: robot-shop.availability
      rules:
        - alert: CatalogueServiceDown
          expr: up{namespace="robot-shop",service="catalogue"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Robot Shop Catalogue is down"
            description: "Prometheus has been unable to scrape the Catalogue service for more than 2 minutes."
