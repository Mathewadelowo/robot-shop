apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: robot-shop-slack
  namespace: monitoring
  labels:
    release: monitoring
spec:
  route:
    receiver: slack
    groupBy:
      - alertname
    groupWait: 10s
    groupInterval: 5m
    repeatInterval: 4h
    matchers:
      - name: alertname
        value: "CatalogueServiceDown|SlackDeliveryTest"
        regex: true
  receivers:
    - name: slack
      slackConfigs:
        - apiURL:
            name: slack-webhook
            key: url
          channel: "#alerts"
          sendResolved: true
          title: '{{ .CommonLabels.alertname }}'
          text: '{{ .CommonAnnotations.description }}'
